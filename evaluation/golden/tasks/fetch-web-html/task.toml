schema_version = "1.4"

[task]
name = "kqode/fetch-web-html"
version = "0.1.0"
authors = [{ name = "KQode contributors" }]
description = "Fetch HTML and extract its title."
keywords = ["kqode", "golden", "run-command", "web-fetch"]

[metadata]
difficulty = "easy"
category = "web-fetch"
target_tool = "fetch_web_url"
lifecycle = "candidate"


[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 300.0

[environment]
build_timeout_sec = 600.0
workdir = "/app"
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0

[verifier.env]

[solution.env]
