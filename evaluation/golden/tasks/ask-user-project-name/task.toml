schema_version = "1.4"

[task]
name = "kqode/ask-user-project-name"
version = "0.1.0"
authors = [{ name = "KQode contributors" }]
description = "Ask for a required missing project name."
keywords = ["kqode", "golden", "run-command", "user-interaction"]

[metadata]
difficulty = "easy"
category = "user-interaction"
