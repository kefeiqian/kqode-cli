# Continuous integration for the Tauri desktop app and Rust core.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.paths.outputs.desktop }}
      rust: ${{ steps.paths.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="origin/${{ github.base_ref }}"
            git fetch --no-tags origin "${{ github.base_ref }}"
            base="$(git merge-base "$base_ref" HEAD)"
            head="HEAD"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-list --max-parents=0 "$head" | tail -1)"
            fi
          fi

          git diff --name-only "$base" "$head" > changed-files.txt
          desktop=false
          rust=false

          while IFS= read -r changed_path; do
            case "$changed_path" in
              crates/kqode-desktop/*)
                rust=true
                desktop=true
                ;;
              .cargo/*|.github/workflows/ci.yml|Cargo.lock|Cargo.toml|crates/kqode-cli/*|crates/kqode-core/*|crates/kqode-provider/*|scripts/*|xtask/*)
                rust=true
                ;;
              .github/workflows/release.yml)
                rust=true
                desktop=true
                ;;
            esac
          done < changed-files.txt

          echo "Changed files:"
          cat changed-files.txt
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust (fmt, clippy, build, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Workspace boundaries
        run: cargo xtask workspace-boundaries
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  desktop:
    name: Desktop frontend
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies
        working-directory: crates/kqode-desktop/frontend
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: crates/kqode-desktop/frontend
        run: bun run build
