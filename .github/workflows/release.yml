# Builds, installs, validates, and publishes the Windows Tauri application.
#
# Version tags publish NSIS and MSI installers. Manual runs execute the same
# validation and retain the installers as workflow artifacts.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: build and validate windows-x64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Verify release versions
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $cargoManifests = @(
            "Cargo.toml"
          )
          $cargoVersions = $cargoManifests | ForEach-Object {
            $match = Select-String -Path $_ -Pattern '^version = "([^"]+)"$' |
              Select-Object -First 1
            $match.Matches[0].Groups[1].Value
          }
          $coreDependencyManifests = @(
            "crates\kqode-cli\Cargo.toml",
            "crates\kqode-desktop\Cargo.toml",
            "crates\kqode-provider\Cargo.toml"
          )
          $coreDependencyVersions = $coreDependencyManifests | ForEach-Object {
            Select-String -Path $_ -Pattern '^kqode-core = \{ version = "=([^"]+)"' |
              ForEach-Object { $_.Matches[0].Groups[1].Value }
          }
          $providerDependencyManifests = @(
            "crates\kqode-desktop\Cargo.toml"
          )
          $providerDependencyVersions = $providerDependencyManifests | ForEach-Object {
            Select-String -Path $_ -Pattern '^kqode-provider = \{ version = "=([^"]+)"' |
              ForEach-Object { $_.Matches[0].Groups[1].Value }
          }
          $desktopVersion = (Get-Content crates\kqode-desktop\frontend\package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content crates\kqode-desktop\tauri.conf.json | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $versions = @((
            @($cargoVersions) +
              @($coreDependencyVersions) +
              @($providerDependencyVersions) +
              @($desktopVersion, $tauriVersion)
          ) | Select-Object -Unique)
          if ($versions.Count -ne 1 -or $versions[0] -ne $tagVersion) {
            $cargoSummary = ($cargoVersions -join ", ")
            $coreDependencySummary = ($coreDependencyVersions -join ", ")
            $providerDependencySummary = ($providerDependencyVersions -join ", ")
            throw "Tag v$tagVersion does not match Cargo ($cargoSummary), kqode-core dependencies ($coreDependencySummary), kqode-provider dependencies ($providerDependencySummary), desktop ($desktopVersion), and Tauri ($tauriVersion)"
          }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - uses: Swatinem/rust-cache@v2

      - name: Verify workspace boundaries
        run: cargo xtask workspace-boundaries

      - name: Install desktop dependencies
        working-directory: crates/kqode-desktop/frontend
        run: bun install --frozen-lockfile

      - name: Build Windows installers
        id: tauri
        uses: tauri-apps/tauri-action@v1.0.0
        with:
          projectPath: .
          tauriScript: bun run --cwd crates/kqode-desktop/frontend tauri
          args: --bundles nsis msi

      - name: Validate installed application and Copilot SDK runtime
        shell: pwsh
        run: .\scripts\verify-windows-package.ps1

      - name: Create checksums
        id: bundles
        shell: pwsh
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          $paths = $env:ARTIFACT_PATHS | ConvertFrom-Json
          if ($paths.Count -eq 0) {
            throw "Tauri did not report any bundle artifacts"
          }
          $releaseDirectory = Join-Path $env:RUNNER_TEMP "kqode-release-assets"
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          foreach ($path in $paths) {
            Copy-Item -LiteralPath $path -Destination $releaseDirectory
          }
          Get-ChildItem -LiteralPath $releaseDirectory -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } |
            Set-Content -LiteralPath (Join-Path $releaseDirectory "SHA256SUMS.txt") -Encoding ascii
          "directory=$releaseDirectory" >> $env:GITHUB_OUTPUT

      - name: Upload validated Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kqode-windows-x64
          path: ${{ steps.bundles.outputs.directory }}\*
          if-no-files-found: error

  release:
    name: publish release
    if: github.event_name == 'push'
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download validated Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: kqode-windows-x64
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          nsis=(release-assets/*-setup.exe)
          msi=(release-assets/*.msi)
          checksums=(release-assets/SHA256SUMS.txt)
          if [[ "${#nsis[@]}" -ne 1 || "${#msi[@]}" -ne 1 || "${#checksums[@]}" -ne 1 ]]; then
            echo "Expected exactly one NSIS installer, one MSI installer, and one checksum file." >&2
            exit 1
          fi
          assets=("${nsis[@]}" "${msi[@]}" "${checksums[@]}")
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "KQode ${GITHUB_REF_NAME#v}" \
            --generate-notes
