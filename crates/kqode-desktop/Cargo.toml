[package]
name = "kqode-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "KQode desktop AI coding application"
default-run = "kqode-desktop"

[[bin]]
name = "kqode-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
kqode-core = { version = "=0.1.3", path = "../kqode-core" }
kqode-provider = { version = "=0.1.3", path = "../kqode-provider" }
refinery = { version = "0.9.2", default-features = false, features = ["rusqlite"] }
rusqlite = { version = "0.37", features = ["bundled"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
kqode-provider = { version = "=0.1.3", path = "../kqode-provider", features = ["test-support"] }
